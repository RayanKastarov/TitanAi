<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TitanAI</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1a1a1a;
      --panel-2: #222222;
      --border: #2e2e2e;
      --gold: #FFD700;
      --gold-dim: rgba(255, 215, 0, 0.14);
      --text: #e8e8e8;
      --muted: #8c8c8c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      overflow: hidden;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 20;
    }
    .brand {
      padding: 20px 20px 14px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(255, 215, 0, 0.35);
    }
    .brand span { color: var(--text); font-weight: 300; }
    .new-chat {
      margin: 0 16px 14px;
      padding: 11px;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .new-chat:hover { background: var(--gold-dim); box-shadow: 0 0 12px rgba(255, 215, 0, 0.25); }
    .sidebar-label {
      padding: 6px 20px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .chat-list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; list-style: none; }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.9rem;
      transition: background 0.15s, color 0.15s;
    }
    .chat-item:hover { background: var(--panel-2); color: var(--text); }
    .chat-item.active { background: var(--gold-dim); border-color: rgba(255, 215, 0, 0.35); color: var(--gold); }
    .chat-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item .del {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.05rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .chat-item:hover .del, .chat-item.active .del { opacity: 1; }
    .chat-item .del:hover { color: #ff6b6b; }
    .sidebar-footer { padding: 14px 20px; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--muted); }

    /* ---------- Main chat ---------- */
    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--gold);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .chat-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); margin-left: auto; flex-shrink: 0; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .welcome { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
    .welcome h2 { color: var(--gold); letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 0 16px rgba(255, 215, 0, 0.3); }

    .msg { display: flex; flex-direction: column; max-width: 76%; animation: rise 0.25s ease; }
    .msg .who { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; color: var(--muted); }
    .msg .bubble { padding: 12px 16px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.user .bubble { background: var(--gold); color: #111; font-weight: 500; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; }
    .msg.ai .who { color: var(--gold); }
    .msg.ai .bubble { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-bottom-left-radius: 4px; }
    .msg.error .bubble { border-left-color: #ff6b6b; color: #ffb3b3; }

    .typing { display: none; padding: 0 22px 10px; color: var(--gold); font-size: 0.85rem; font-style: italic; }
    .typing.show { display: block; }
    .typing .dots span { animation: blink 1.2s infinite; opacity: 0.2; }
    .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing .dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ---------- Composer ---------- */
    .composer {
      padding: 14px 22px 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .composer form {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .composer form:focus-within { border-color: var(--gold); box-shadow: 0 0 14px rgba(255, 215, 0, 0.18); }
    .composer textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font: inherit;
      line-height: 1.45;
      max-height: 160px;
      padding: 8px 0;
    }
    .composer textarea::placeholder { color: var(--muted); }
    .send-btn {
      background: var(--gold);
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
    }
    .send-btn:hover:not(:disabled) { box-shadow: 0 0 16px rgba(255, 215, 0, 0.5); }
    .send-btn:active:not(:disabled) { transform: scale(0.97); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---------- Scrollbars ---------- */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    /* ---------- Mobile ---------- */
    @media (max-width: 760px) {
      .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0, 0, 0, 0.7); }
      .menu-btn { display: inline-block; }
      .msg { max-width: 92%; }
      .messages, .chat-header, .composer { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">TITAN<span>AI</span></div>
    <button class="new-chat" id="newChat" type="button">+ NEW CHAT</button>
    <div class="sidebar-label">Chats</div>
    <ul class="chat-list" id="chatList"></ul>
    <div class="sidebar-footer">TitanAI &middot; powered by OpenRouter</div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">&#9776;</button>
      <div class="chat-title" id="chatTitle">New chat</div>
      <div class="status-dot" title="Online"></div>
    </header>

    <section class="messages" id="messages" aria-live="polite"></section>

    <div class="typing" id="typing">TitanAI is typing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>

    <div class="composer">
      <form id="chatForm" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Write a message to TitanAI..." maxlength="4000"></textarea>
        <button class="send-btn" id="sendBtn" type="submit">SEND</button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
