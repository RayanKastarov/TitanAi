<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TitanAI</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TitanAI" />
  <style>
    :root {
      --bg: #0b0b0c;
      --side: #09090a;
      --panel: #1c1c1f;
      --hover: #17171a;
      --active: #252528;
      --border: #222226;
      --menu: #1f1f23;
      --menu-border: #2d2d32;
      --text: #ececee;
      --muted: #8e8e95;
      --silver: #c9ccd1;
      --silver-hi: #f4f5f7;
      --grad: linear-gradient(135deg, #f6f7f9 0%, #c4c7cd 50%, #9a9ea6 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .ic { display: inline-grid; place-items: center; flex-shrink: 0; }
    .ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .app { display: flex; height: 100vh; height: 100dvh; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--side);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease, transform 0.25s ease;
      z-index: 30;
      position: relative;
    }
    .app.collapsed .sidebar { margin-left: -280px; }
    .sb-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 8px 16px; }
    .brand-btn {
      background: none; border: 0; display: flex; align-items: center; gap: 4px;
      font-size: 1.15rem; font-weight: 700; letter-spacing: 1px;
      padding: 4px 6px; margin-left: -6px; border-radius: 8px;
    }
    .brand-btn:hover { background: var(--hover); }
    .brand-btn b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand-btn .ic svg { width: 16px; height: 16px; color: var(--muted); }
    .icon-btn {
      background: none; border: 0; width: 36px; height: 36px; border-radius: 10px;
      display: inline-grid; place-items: center; color: var(--silver);
    }
    .icon-btn:hover { background: var(--hover); color: var(--silver-hi); }
    .icon-btn.on { background: var(--active); color: var(--silver-hi); }
    .search-box { padding: 4px 12px 8px; }
    .search-box input {
      width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); padding: 9px 12px; font: inherit; font-size: 0.9rem; outline: none;
    }
    .search-box input:focus { border-color: #5b5e66; }

    .sb-scroll { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
    .nav-item, .chat-item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      height: 38px; padding: 0 10px; border-radius: 10px;
      background: none; border: 0; text-align: left; color: var(--text); font-size: 0.92rem;
    }
    .nav-item:hover, .chat-item:hover { background: var(--hover); }
    .nav-item.primary { background: var(--active); margin-bottom: 6px; }
    .nav-item .ic svg { color: var(--silver); }
    .sec-head {
      display: flex; align-items: center; gap: 6px;
      margin: 20px 0 6px; padding: 0 10px;
      font-size: 0.82rem; color: var(--muted); font-weight: 600; background: none; border: 0; width: 100%; text-align: left;
    }
    .sec-head .ic svg { width: 14px; height: 14px; }
    .sec-head.plain { cursor: default; }
    .muted-empty { padding: 4px 10px; color: #5f5f66; font-size: 0.9rem; }
    .list { list-style: none; }
    .chat-item { cursor: pointer; color: #d6d6da; }
    .chat-item.active { background: var(--active); color: var(--silver-hi); }
    .chat-item .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item .pin-mark { color: var(--muted); }
    .chat-item .pin-mark svg { width: 15px; height: 15px; }
    .chat-item .dots { background: none; border: 0; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; display: none; place-items: center; }
    .chat-item .dots svg { width: 18px; height: 18px; }
    .chat-item .dots:hover { color: var(--silver-hi); background: #323236; }
    .chat-item:hover .dots, .chat-item.active .dots { display: inline-grid; }

    .profile-wrap { position: relative; padding: 8px 10px 10px; border-top: 1px solid var(--border); }
    .profile-btn {
      display: flex; align-items: center; gap: 12px; width: 100%;
      background: none; border: 0; border-radius: 12px; padding: 8px; text-align: left;
    }
    .profile-btn:hover { background: var(--hover); }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      background: #34353a; color: var(--silver-hi); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px;
    }
    .pname { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
    .pname b { font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pname small { color: var(--muted); font-size: 0.78rem; }

    /* ---------- Menus ---------- */
    .menu {
      position: absolute; z-index: 60; min-width: 230px;
      background: var(--menu); border: 1px solid var(--menu-border); border-radius: 16px;
      padding: 6px; box-shadow: 0 14px 44px rgba(0, 0, 0, 0.65);
    }
    .menu button {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 10px 12px; border-radius: 10px; background: none; border: 0; text-align: left; font-size: 0.92rem;
    }
    .menu button:hover:not(:disabled) { background: #2b2b30; }
    .menu button:disabled { opacity: 0.45; cursor: default; }
    .menu button.danger { color: #ff8a8a; }
    .menu button .grow { flex: 1; }
    .menu button small { display: block; color: var(--muted); font-size: 0.75rem; }
    .menu button .ic svg { color: var(--silver); }
    .menu button.danger .ic svg { color: #ff8a8a; }
    .menu hr { border: 0; border-top: 1px solid var(--menu-border); margin: 6px 4px; }
    .profile-menu { left: 10px; right: 10px; bottom: calc(100% - 4px); }
    .profile-menu .who { padding: 10px 12px; }
    .profile-menu .who .avatar { width: 28px; height: 28px; }
    .brand-menu { top: 52px; left: 12px; }
    .ctx { position: fixed; min-width: 190px; }

    /* ---------- Main ---------- */
    .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; position: relative; }
    .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 16px; }
    .topbar .left { display: flex; }
    .topbar .right { display: flex; justify-content: flex-end; }
    .menu-btn { display: none; }
    .app.collapsed .menu-btn { display: inline-grid; }
    .seg { display: flex; background: #131315; border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
    .seg button { background: none; border: 0; padding: 8px 40px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 0.9rem; }
    .seg button.on { background: #29292d; color: var(--silver-hi); }
    .seg button:not(.on):hover { color: var(--text); }

    .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px 9vh; }
    .hero h1 { font-size: 1.7rem; font-weight: 500; margin-bottom: 26px; text-align: center; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #heroSlot, #bottomSlot { width: 100%; max-width: 768px; }
    .suggest { list-style: none; width: 100%; max-width: 768px; margin-top: 26px; }
    .suggest li button {
      display: flex; align-items: center; gap: 14px; width: 100%;
      background: none; border: 0; padding: 12px 16px; border-radius: 12px; color: #d3d3d8; text-align: left; font-size: 0.95rem;
    }
    .suggest li button:hover { background: var(--hover); }
    .suggest .ic svg { color: var(--silver); }

    .chat.empty .messages, .chat.empty .bottom { display: none; }
    .chat:not(.empty) .hero { display: none; }

    .messages { flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .row { width: 100%; max-width: 768px; display: flex; gap: 14px; animation: rise 0.25s ease; }
    .row.user { justify-content: flex-end; }
    .ububble { max-width: 80%; background: #27272b; padding: 10px 16px; border-radius: 20px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .ai-av {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
      display: grid; place-items: center; font-weight: 800; font-size: 0.8rem; color: #111; background: var(--grad);
    }
    .content { flex: 1; min-width: 0; line-height: 1.7; overflow-wrap: anywhere; }
    .content.err { color: #ff9a9a; }
    .content p { margin-bottom: 10px; }
    .content p:last-of-type { margin-bottom: 4px; }
    .content ul, .content ol { margin: 4px 0 10px 22px; }
    .content li { margin-bottom: 4px; }
    .content h4 { margin: 12px 0 6px; font-size: 1.02rem; color: var(--silver-hi); }
    .content strong { color: var(--silver-hi); }
    .content code { background: #202024; padding: 2px 6px; border-radius: 6px; font-family: Consolas, "SF Mono", monospace; font-size: 0.88em; }
    .content pre { background: #111113; border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow-x: auto; margin: 8px 0 12px; }
    .content pre code { background: none; padding: 0; }
    .acts { margin-top: 4px; }
    .acts button { background: none; border: 0; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; }
    .acts button:hover { background: var(--hover); color: var(--silver-hi); }
    .acts svg { width: 16px; height: 16px; }
    .tdots { display: inline-flex; gap: 4px; vertical-align: middle; margin-right: 8px; }
    .tdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--silver); animation: blink 1.2s infinite; opacity: 0.25; }
    .tdots i:nth-child(2) { animation-delay: 0.2s; }
    .tdots i:nth-child(3) { animation-delay: 0.4s; }
    .tlabel { color: var(--muted); font-style: italic; font-size: 0.92rem; }

    .bottom { padding: 0 20px 14px; display: flex; flex-direction: column; align-items: center; }
    .disclaimer { color: #66666d; font-size: 0.72rem; margin-top: 10px; text-align: center; }

    /* ---------- Composer ---------- */
    .composer-wrap { position: relative; width: 100%; }
    .composer {
      display: flex; align-items: flex-end; gap: 6px;
      background: var(--panel); border: 1px solid #28282c; border-radius: 28px; padding: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .composer:focus-within { border-color: #5d6068; box-shadow: 0 0 22px rgba(201, 204, 209, 0.1); }
    .c-btn { background: none; border: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--silver); flex-shrink: 0; }
    .c-btn:hover { background: #2a2a2e; color: var(--silver-hi); }
    .c-btn.rec { color: #ff6b6b; animation: blink 1s infinite; }
    .composer textarea {
      flex: 1; background: transparent; border: 0; outline: 0; resize: none; color: var(--text);
      font: inherit; line-height: 1.45; max-height: 180px; padding: 9px 4px;
    }
    .composer textarea::placeholder { color: var(--muted); }
    .effort-btn { background: none; border: 0; display: flex; align-items: center; gap: 4px; color: var(--muted); padding: 0 8px; height: 38px; border-radius: 10px; font-size: 0.92rem; }
    .effort-btn:hover { color: var(--silver-hi); background: #2a2a2e; }
    .effort-btn .ic svg { width: 16px; height: 16px; }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; flex-shrink: 0;
      background: var(--grad); color: #111; transition: opacity 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    .send-btn:hover:not(:disabled) { box-shadow: 0 0 16px rgba(220, 223, 228, 0.45); }
    .send-btn:active:not(:disabled) { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .send-btn svg { stroke-width: 2.4; }
    .pop-plus { left: 4px; bottom: calc(100% + 10px); }
    .pop-effort { right: 90px; bottom: calc(100% + 10px); min-width: 220px; }

    /* ---------- Modal & toast ---------- */
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: grid; place-items: center; z-index: 100; padding: 16px; }
    .modal { background: #1a1a1d; border: 1px solid var(--menu-border); border-radius: 20px; padding: 22px; width: min(440px, 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7); animation: rise 0.2s ease; }
    .modal h3 { margin-bottom: 14px; font-weight: 600; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
    .modal label { display: block; color: var(--muted); font-size: 0.8rem; margin: 10px 0 6px; }
    .modal input, .modal textarea {
      width: 100%; background: #101012; border: 1px solid var(--menu-border); border-radius: 12px;
      color: var(--text); padding: 10px 12px; font: inherit; outline: none; resize: vertical;
    }
    .modal input:focus, .modal textarea:focus { border-color: #6b6e76; }
    .modal p, .modal li { color: #c4c4ca; line-height: 1.6; font-size: 0.92rem; }
    .modal ul { margin-left: 18px; }
    .m-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .m-actions button, .modal .inline-btn { padding: 9px 18px; border-radius: 999px; border: 1px solid var(--menu-border); background: none; font-weight: 600; font-size: 0.9rem; }
    .m-actions button:hover { background: #2a2a2e; }
    .m-actions .primary { background: var(--grad); color: #111; border: 0; }
    .m-actions .primary:hover { background: var(--grad); filter: brightness(1.08); }
    .m-actions .danger, .modal .inline-btn.danger { color: #ff8a8a; border-color: #5a2a2a; }
    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      background: #26262a; border: 1px solid var(--menu-border); color: var(--text); padding: 10px 18px; border-radius: 999px;
      font-size: 0.88rem; transition: all 0.25s; z-index: 120;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .tabs { display: flex; gap: 6px; background: #111113; border-radius: 12px; padding: 4px; margin-bottom: 4px; }
    .tab { flex: 1; background: none; border: 0; padding: 9px; border-radius: 9px; color: var(--muted); font-weight: 600; }
    .tab.on { background: #2a2a2e; color: var(--silver-hi); }
    .form-err { color: #ff8a8a; font-size: 0.85rem; min-height: 1.2em; margin-top: 10px; }
    .modal .hint { color: var(--muted); font-size: 0.8rem; margin-top: 6px; }
    .pname small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .backdrop { display: none; }


    /* ---------- Attachments ---------- */
    .attach-tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 10px; }
    .att {
      position: relative; display: flex; align-items: center; gap: 8px; max-width: 220px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px 30px 6px 6px;
      font-size: 0.82rem; color: var(--text);
    }
    .att .thumb, .att .ficon { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; object-fit: cover; background: #111113; display: grid; place-items: center; color: var(--silver); }
    .att .ficon svg { width: 18px; height: 18px; }
    .att .meta { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .att .meta b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .att .meta small { color: var(--muted); font-size: 0.72rem; }
    .att .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
    .att .x:hover { background: #2f2f34; color: var(--silver-hi); }
    .att .x svg { width: 13px; height: 13px; }
    .att.loading .meta small { font-style: italic; }
    .ucol { max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .ucol .ububble { max-width: 100%; }
    .ufiles { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .ufiles .att { padding-right: 10px; background: #222226; }
    .composer-wrap.drag .composer { border-color: #8d91ff; box-shadow: 0 0 22px rgba(141, 145, 255, 0.25); }

    /* ---------- Sidebar badge, wide modals, lists ---------- */
    .nav-item .badge { margin-left: auto; background: var(--active); color: var(--silver-hi); font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
    .modal.wide { width: min(640px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
    .modal.wide > .body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .modal .scroll { overflow-y: auto; min-height: 0; flex: 1; margin: 0 -6px; padding: 0 6px; }
    .modal .sub { color: var(--muted); font-size: 0.85rem; margin: -6px 0 12px; }
    .item {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: #131315; border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 8px; color: var(--text);
    }
    button.item:hover { background: #1a1a1d; border-color: #35353a; }
    .item .ficon, .item .thumb { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; background: #1c1c1f; display: grid; place-items: center; color: var(--silver); object-fit: cover; }
    .item .ficon svg { width: 20px; height: 20px; }
    .item .info { flex: 1; min-width: 0; line-height: 1.35; }
    .item .info b { display: block; font-weight: 600; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .info small { color: var(--muted); font-size: 0.78rem; display: block; }
    .item .info p { margin: 4px 0 0; font-size: 0.85rem; color: #b5b5bb; white-space: pre-wrap; overflow-wrap: anywhere; }
    .item .btns { display: flex; gap: 2px; flex-shrink: 0; }
    .item .btns button { background: none; border: 0; width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
    .item .btns button:hover { background: #2a2a2e; color: var(--silver-hi); }
    .item .btns svg { width: 17px; height: 17px; }
    .empty-note { color: #6b6b72; text-align: center; padding: 26px 8px; font-size: 0.92rem; }
    .switch { width: 42px; height: 24px; border-radius: 999px; background: #34353a; position: relative; flex-shrink: 0; transition: background 0.2s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #d8d9dd; transition: transform 0.2s; }
    .item.on .switch { background: var(--accent, #5b6cff); }
    .item.on .switch::after { transform: translateX(18px); background: #fff; }
    .cat { margin: 16px 0 8px; font-size: 0.8rem; font-weight: 700; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; }
    .cat:first-child { margin-top: 0; }

    .att svg, .item svg, .acts svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; border: 1px solid #55555c; }

    /* ---------- Extras: chips, slash menu, tables, plans ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { background: none; border: 1px solid var(--border); color: var(--silver); border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; }
    .chip:hover { background: var(--hover); color: var(--silver-hi); border-color: #3a3a40; }
    .c-btn.on { background: var(--active); color: var(--silver-hi); box-shadow: 0 0 0 1px #5d6068 inset; }
    .c-btn.busy { animation: blink 1s infinite; }
    .pop-slash { left: 4px; bottom: calc(100% + 10px); min-width: 320px; max-height: 320px; overflow-y: auto; }
    .tbl { overflow-x: auto; margin: 8px 0 12px; }
    .content table { border-collapse: collapse; font-size: 0.9rem; }
    .content th, .content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; vertical-align: top; }
    .content th { background: #17171a; color: var(--silver-hi); }
    .plans { display: grid; gap: 12px; }
    @media (min-width: 640px) { .plans { grid-template-columns: 1fr 1fr; } }
    .plan { border: 1px solid var(--border); border-radius: 16px; padding: 16px; background: #131315; }
    .plan.pro { border-color: #6b6e76; box-shadow: 0 0 28px rgba(201, 204, 209, 0.08); }
    .plan h4 { font-size: 1rem; color: var(--silver-hi); }
    .plan .price { font-size: 1.5rem; font-weight: 700; margin: 4px 0 8px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
    .plan .price small { font-size: 0.8rem; font-weight: 500; }
    .plan ul { list-style: none; margin: 0; }
    .plan li { padding: 5px 0; font-size: 0.86rem; line-height: 1.45; }
    .plan .ok { color: #6fdc8c; font-weight: 700; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #2c2c30; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3c3c42; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* ---------- Mobile ---------- */
    @media (max-width: 820px) {
      .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); margin-left: 0 !important; }
      .app.sb-open .sidebar { transform: none; box-shadow: 0 0 50px rgba(0, 0, 0, 0.8); }
      .app.sb-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 25; }
      .menu-btn { display: inline-grid !important; }
      .seg button { padding: 8px 24px; }
      .hero h1 { font-size: 1.35rem; }
      .ucol { max-width: 90%; }
      .effort-btn span:first-child { display: none; }
      .pop-effort { right: 10px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-top">
        <button class="brand-btn" id="brandBtn" type="button"><b>TitanAI</b><i class="ic" data-ic="chevd"></i></button>
        <div>
          <button class="icon-btn" id="searchBtn" type="button" title="Търсене"><i class="ic" data-ic="search"></i></button>
          <button class="icon-btn" id="collapseBtn" type="button" title="Страничен панел"><i class="ic" data-ic="panel"></i></button>
        </div>
      </div>
      <div class="menu brand-menu" id="brandMenu" hidden>
        <button type="button"><i class="ic" data-ic="check"></i><span class="grow">TitanAI Flash<small>Бърз и умен</small></span></button>
        <button type="button" disabled><i class="ic" data-ic="sparkle"></i><span class="grow">TitanAI Pro<small>Скоро</small></span></button>
      </div>
      <div class="search-box" id="searchBox" hidden>
        <input id="searchInput" type="text" placeholder="Търсене в чатовете..." />
      </div>

      <nav class="sb-scroll">
        <button class="nav-item primary" id="newChat" type="button"><i class="ic" data-ic="edit"></i><span>Нов чат</span></button>
        <button class="nav-item" type="button" data-soon="Насрочени"><i class="ic" data-ic="clock"></i><span>Насрочени</span></button>
        <button class="nav-item" id="libraryBtn" type="button"><i class="ic" data-ic="library"></i><span>Библиотека</span></button>
        <button class="nav-item" id="pluginsBtn" type="button"><i class="ic" data-ic="at"></i><span>Плъгини</span><span class="badge" id="pluginsBadge" hidden></span></button>
        <button class="nav-item" id="browseBtn" type="button"><i class="ic" data-ic="dots"></i><span>Разглеждане</span></button>

        <button class="sec-head" id="pinnedHead" type="button" hidden><span>Закачени</span><i class="ic" data-ic="chevd"></i></button>
        <ul class="list" id="pinnedList"></ul>

        <div class="sec-head plain">Проекти</div>
        <div class="muted-empty">Няма проекти</div>

        <div class="sec-head plain">Скорошни</div>
        <ul class="list" id="recentList"></ul>
        <div class="muted-empty" id="recentEmpty" hidden>Няма чатове</div>
      </nav>

      <div class="profile-wrap">
        <div class="menu profile-menu" id="profileMenu" hidden>
          <button type="button" data-act="profile" class="who">
            <span class="avatar" id="pmAvatar"></span>
            <span class="grow pname"><b id="pmName"></b><small id="pmPlan"></small></span>
            <i class="ic" data-ic="chevr"></i>
          </button>
          <hr />
          <button type="button" data-act="upgrade"><i class="ic" data-ic="sparkle"></i><span>Надградете плана</span></button>
          <button type="button" data-act="personal"><i class="ic" data-ic="sliders"></i><span>Персонализация</span></button>
          <button type="button" data-act="memory"><i class="ic" data-ic="book"></i><span>Памет</span></button>
          <button type="button" data-act="profile"><i class="ic" data-ic="user"></i><span>Профил</span></button>
          <button type="button" data-act="settings"><i class="ic" data-ic="settings"></i><span>Настройки</span></button>
          <hr />
          <button type="button" data-act="help"><i class="ic" data-ic="help"></i><span class="grow">Помощ</span><i class="ic" data-ic="chevr"></i></button>
          <button type="button" data-act="logout"><i class="ic" data-ic="logout"></i><span id="logoutLabel">Излизане от акаунта</span></button>
        </div>
        <button class="profile-btn" id="profileBtn" type="button">
          <span class="avatar" id="avatar"></span>
          <span class="pname"><b id="pName"></b><small id="pPlan"></small></span>
        </button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="chat empty" id="chat">
      <header class="topbar">
        <div class="left"><button class="icon-btn menu-btn" id="menuBtn" type="button" title="Меню"><i class="ic" data-ic="panel"></i></button></div>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="chat" class="on">Chat</button>
          <button type="button" data-mode="work">Work</button>
        </div>
        <div class="right"><button class="icon-btn" id="tempBtn" type="button" title="Временен чат"><i class="ic" data-ic="temp"></i></button></div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <section class="hero" id="hero">
        <h1 id="greeting">Какво предстои днес?</h1>
        <div id="heroSlot">
          <div class="composer-wrap" id="composerWrap">
            <div class="attach-tray" id="attachTray" hidden></div>
            <form class="composer" id="chatForm" autocomplete="off">
              <button class="c-btn" id="plusBtn" type="button" title="Добави"><i class="ic" data-ic="plus"></i></button>
              <textarea id="input" rows="1" placeholder="Попитайте TitanAI" maxlength="12000"></textarea>
              <button class="c-btn" id="enhanceBtn" type="button" title="Подобри промпта ✨"><i class="ic" data-ic="sparkle"></i></button>
              <button class="effort-btn" id="effortBtn" type="button"><span id="effortLabel">Medium</span><i class="ic" data-ic="chevd"></i></button>
              <button class="c-btn" id="micBtn" type="button" title="Диктуване"><i class="ic" data-ic="mic"></i></button>
              <button class="send-btn" id="sendBtn" type="submit" title="Изпрати" disabled><i class="ic" data-ic="arrowup"></i></button>
            </form>
            <div class="menu pop-plus" id="plusMenu" hidden></div>
            <div class="menu pop-effort" id="effortMenu" hidden></div>
            <div class="menu pop-slash" id="slashMenu" hidden></div>
          </div>
        </div>
        <ul class="suggest" id="suggest"></ul>
      </section>

      <div class="bottom" id="bottom">
        <div id="bottomSlot"></div>
        <p class="disclaimer">TitanAI може да допуска грешки. Проверявайте важната информация.</p>
      </div>
    </main>
  </div>

  <div class="menu ctx" id="ctx" hidden></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" hidden multiple />

  <script src="app.js"></script>
</body>
</html>
